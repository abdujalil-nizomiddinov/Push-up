<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push-up Hisoblagich</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14171d;--mu:#6b7385;--ac:#ff5a36;--ok:#1fa85a;--bd:#e3e6ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#8b93a5;--bd:#2a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#8b93a5;--bd:#2a2f3a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px;text-align:center}
.sub{color:var(--mu);text-align:center;font-size:13px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.row+.row{border-top:1px solid var(--bd)}
.st{display:flex;align-items:center;gap:10px}
.st b{min-width:54px;text-align:center;font-size:18px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.sb{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);font-size:20px}
.big{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:700;font-size:18px}
.big.g{background:var(--ok)}
.big.o{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:600;font-size:15px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px}
.mu{color:var(--mu);font-size:13px}
.tot{font-size:34px;font-weight:800;color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}
.tm{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.ph{text-align:center;font-weight:700;letter-spacing:.08em;color:var(--ac)}
.ph.r{color:var(--ok)}
.pbar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:10px 0;border:1px solid var(--bd)}
#pb{height:100%;width:0;background:var(--ac);transition:width .3s linear}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:26px;height:6px;border-radius:4px;background:var(--bd)}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--ac)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.cnt button{width:76px;height:76px;border-radius:50%;font-size:38px;background:var(--card);border:2px solid var(--bd)}
.cnt button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.num{font-size:96px;font-weight:800;line-height:1;text-align:center;flex:1;animation:pop .25s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.h{display:flex;justify-content:space-between;align-items:flex-start}
.del{background:none;color:var(--mu);font-size:12px;padding:4px}
.up{color:var(--ok);font-weight:700}.dn{color:#e5484d;font-weight:700}
svg.fig{display:block;margin:0 auto;width:100%;max-width:260px;height:auto}
</style></head><body><div id="app"></div>
<script>
const K='pushup_v1',$=s=>document.querySelector(s);
let S={settings:{sets:5,work:60,rest:60,sound:true},history:[],active:null};
try{const r=JSON.parse(localStorage.getItem(K));if(r)S={...S,...r,settings:{...S.settings,...r.settings}}}catch(e){}
if(S.active&&!S.active.s)S.active.s=Date.now();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};function lock(){try{if(!S.active||!navigator.wakeLock)return;navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(e){}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.active&&!wl)lock()});
let view='home',done=null,armed='',lastR=null,AC,wl;
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const dt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())};
function beep(f=880,d=.15,n=1){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*(d+.1);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:100)}catch(e){}}
const fig=()=>`<svg class="fig" viewBox="0 0 220 140"><line x1="5" y1="124" x2="215" y2="124" stroke="currentColor" opacity=".25" stroke-width="3"/><g stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none"><line x1="25" y1="116" x2="150" y2="78"><animate attributeName="y2" values="78;102;78" dur="2s" repeatCount="indefinite"/></line><line x1="150" y1="78" x2="150" y2="120"><animate attributeName="y1" values="78;102;78" dur="2s" repeatCount="indefinite"/></line></g><circle cx="168" cy="64" r="11" fill="#ff5a36"><animate attributeName="cy" values="64;88;64" dur="2s" repeatCount="indefinite"/></circle></svg>`;
const chips=a=>'<div class="chips">'+a.map((v,i)=>`<span class="chip">${i+1}-set: <b>${v}</b></span>`).join('')+'</div>';
const step=(l,k,v,t)=>`<div class="row"><span>${l}</span><span class="st"><button class="sb" data-a="st" data-k="${k}" data-d="-1">−</button><b>${t}</b><button class="sb" data-a="st" data-k="${k}" data-d="1">+</button></span></div>`;
const arm=(k,t,t2)=>armed===k?`<button class="del" style="color:#e5484d" data-a="${t}" data-k="${k}">Ishonchingiz komilmi? Ha</button>`:`<button class="del" data-a="arm" data-k="${k}">${t2}</button>`;
function render(){let h='';const s=S.settings,a=S.active,H=S.history;
if(a){const p=H[0],pv=p?p.sets[a.idx]:null,w=a.ph==='work';
h=`<h1>${w?'Push-up':'Dam olish'}</h1><div class="sub">${a.idx+1}-set / ${a.n}</div><div class="dots">${a.sets.map((_,i)=>`<i class="${i<a.idx||(i===a.idx&&!w)?'d':i===a.idx?'c':''}"></i>`).join('')}</div>
<div class="card"><div class="ph ${w?'':'r'}">${w?'BAJARING!':'DAM OLING'}</div><div class="tm" id="tm">${w?fmt(Math.floor((Date.now()-a.s)/1000)):fmt(Math.ceil((a.end-Date.now())/1000))}</div>${w?'':'<div class="pbar"><div id="pb"></div></div>'}${w?fig():''}
${w?`<div class="cnt"><button data-a="inc" data-d="-1">−</button><div class="num" data-a="inc" data-d="1">${a.sets[a.idx]}</div><button class="p" data-a="inc" data-d="1">+</button></div><div class="sub">${pv!=null?'Oldingi urinish: <b>'+pv+'</b>':'Birinchi urinish'}</div>`
:`<div class="sub" style="margin-top:12px">${a.idx+1}-set natijasi</div><div class="num" style="animation:none;font-size:72px">${a.sets[a.idx]}</div><div class="sub">Keyingi: ${a.idx+2}-set${p&&p.sets[a.idx+1]!=null?' (oldin: '+p.sets[a.idx+1]+')':''}</div>`}</div>
${w?'<button class="big g" data-a="end">Setni tugatish</button>':'<button class="big" data-a="skip">O‘tkazib yuborish ▶</button>'}
<div style="margin-top:10px">${arm('cancel','cancel','Mashqni bekor qilish')}</div>`;}
else if(view==='done'&&done){const p=H[1],df=p?done.total-p.total:null;
h=`<h1>Tugadi! 🎉</h1><div class="sub">${dt(done.ts)}</div><div class="card" style="text-align:center">${fig()}<div class="mu">Jami</div><div class="tot">${done.total}</div>${df!=null?`<div class="${df>=0?'up':'dn'}">${df>=0?'▲ +':'▼ '}${df} oldingisiga nisbatan (${p.total})</div>`:''}${chips(done.sets)}</div><button class="big" data-a="again">Qayta qilish</button>`;}
else{const p=H[0],tt=H.reduce((x,r)=>x+r.total,0),best=H.reduce((x,r)=>Math.max(x,r.total),0);
h=`<h1>💪 Push-up Hisoblagich</h1><div class="sub">Setlarni sanang, natijani kuzating</div>${fig()}
${p?`<div class="card"><div class="mu">Oxirgi natija · ${dt(p.ts)}</div><div class="tot">${p.total}</div>${chips(p.sets)}</div>`:''}
<div class="card"><b>Sozlamalar</b>${step('Setlar soni','sets',s.sets,s.sets)}${step('Dam olish vaqti','rest',s.rest,fmt(s.rest))}
<div class="row"><span>Ovoz</span><button class="sb" style="width:64px;border-radius:18px;font-size:14px" data-a="snd">${s.sound?'Yoniq':'O‘chiq'}</button></div></div>
<button class="big g" data-a="start">▶ Boshlash</button>
${H.length?`<div class="card stats"><div><b>${H.length}</b><span class="mu">mashq</span></div><div><b>${tt}</b><span class="mu">jami</span></div><div><b>${best}</b><span class="mu">rekord</span></div></div>
<div class="h"><b>Tarix</b>${arm('clear','clear','Hammasini o‘chirish')}</div>
${H.map(r=>`<div class="card"><div class="h"><div><div class="mu">${dt(r.ts)}</div><b style="font-size:22px">${r.total}</b> <span class="mu">ta · ${r.sets.length} set</span></div>${arm('d'+r.id,'del','O‘chirish')}</div>${chips(r.sets)}</div>`).join('')}`:''}`;}
$('#app').innerHTML=h;}
function afterWork(){const a=S.active;beep(660,.3,2);if(a.idx>=a.n-1){const sets=a.sets.slice();const rec={id:Date.now(),ts:a.t,sets,total:sets.reduce((x,y)=>x+y,0)};S.history.unshift(rec);S.active=null;done=rec;view='done';try{wl&&wl.release()}catch(e){}}else{a.ph='rest';a.end=Date.now()+S.settings.rest*1000}}
function nextSet(){const a=S.active;a.idx++;a.ph='work';a.s=Date.now();a.end=0;beep(1000,.12,2)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=S.active,s=S.settings,d=+b.dataset.d,k=b.dataset.k,x=b.dataset.a;
if(x!=='arm')armed='';
if(x==='st'){if(k==='sets')s.sets=Math.min(10,Math.max(1,s.sets+d));else s[k]=Math.min(600,Math.max(15,s[k]+d*15))}
else if(x==='snd')s.sound=!s.sound;
else if(x==='start'){beep(1000,.05,1);const n=Date.now();S.active={t:n,n:s.sets,idx:0,ph:'work',s:n,sets:Array(s.sets).fill(0),end:0};lastR=null;lock()}
else if(x==='inc'&&a)a.sets[a.idx]=Math.max(0,a.sets[a.idx]+d);
else if(x==='end'&&a){afterWork()}
else if(x==='skip'&&a)nextSet();
else if(x==='again'){view='home';done=null}
else if(x==='arm')armed=k;
else if(x==='cancel'){S.active=null;view='home'}
else if(x==='clear')S.history=[];
else if(x==='del')S.history=S.history.filter(r=>'d'+r.id!==k);
if(S.active&&!wl)lock();save();render();});
setInterval(()=>{const a=S.active;if(!a)return;if(a.ph==='work'){const e=$('#tm');if(e)e.textContent=fmt(Math.floor((Date.now()-a.s)/1000));return}const r=Math.ceil((a.end-Date.now())/1000),tot=S.settings.rest;
const el=$('#tm');if(el)el.textContent=fmt(r);const pb=$('#pb');if(pb)pb.style.width=Math.min(100,Math.max(0,(1-r/tot)*100))+'%';
if(r!==lastR){lastR=r;if(r>0&&r<=3)beep(700,.1,1)}
if(r<=0){a.ph==='work'?afterWork():nextSet();lastR=null;save();render()}},250);
render();
</script></body></html>
